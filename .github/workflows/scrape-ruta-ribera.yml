name: Scraper Ruta del Vino Ribera del Duero

# Semanal, en su propia franja: viernes 04:27 UTC (después del lunes de Ribera, que carga las bodegas).
# La fuente nace inactiva (fuentes.activa = false): el CLI no ejecuta nada hasta que se active, salvo --dry-run.
# Nunca se ejecuta en pull requests: solo cron y lanzamiento manual.
on:
  schedule:
    - cron: "27 4 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run: no toca la BD y sube el JSON normalizado como artefacto"
        type: boolean
        default: false
      limit:
        description: "Máximo de fichas y de productos a procesar (vacío = todas)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: scrape-ruta-ribera
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Ejecutar scraper
        env:
          # Solo se pasan en ejecuciones reales; en dry-run no hacen falta.
          SUPABASE_URL: ${{ !inputs.dry_run && secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ !inputs.dry_run && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=(ruta-ribera)
          if [ -n "$DRY_RUN" ]; then args+=(--dry-run --out scrapers/out/ruta-ribera.json); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          node scrapers/cli.ts "${args[@]}"

      - name: Subir resultado del dry-run
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: ruta-ribera-dry-run
          path: scrapers/out/ruta-ribera.json
          if-no-files-found: ignore
          retention-days: 14
