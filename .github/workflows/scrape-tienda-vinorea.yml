name: Scraper tienda Vinorea

# Semanal (domingo 03:13 UTC, `13 3 * * 0`) y lanzamiento manual: listados + fichas (≤ 700 peticiones a 10–14 s).
# Scraper de tienda parametrizado por plataforma (scrapers/fuentes/tiendas/); ver docs/SOURCES.md §4.6.
# Nunca se ejecuta en pull requests: solo cron y lanzamiento manual.
on:
  schedule:
    - cron: "13 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run: no toca la BD y sube el JSON normalizado como artefacto"
        type: boolean
        default: false
      limit:
        description: "Máximo de fichas a procesar (vacío = todas)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: scrape-tienda-vinorea
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Ejecutar scraper
        env:
          # Solo se pasan en ejecuciones reales; en dry-run no hacen falta.
          SUPABASE_URL: ${{ !inputs.dry_run && secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ !inputs.dry_run && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=(tienda-vinorea)
          if [ -n "$DRY_RUN" ]; then args+=(--dry-run --out scrapers/out/tienda-vinorea.json); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          node scrapers/cli.ts "${args[@]}"

      - name: Subir resultado del dry-run
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: tienda-vinorea-dry-run
          path: scrapers/out/tienda-vinorea.json
          if-no-files-found: ignore
          retention-days: 14
