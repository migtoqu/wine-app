name: Scraper Wikimedia Commons (fotos de bodega)

# Mensual, en su propia franja: día 8 a las 04:53 UTC (el día 1 lo usa OSM; el resto de fuentes son semanales
# y a otras horas). Recorre ~900 páginas de categorías y fichas de Commons a 3–5 s por petición (~15 min).
# Solo HTML público de /wiki/Category y /wiki/File (robots.txt excluye /w/ y /sparql); imágenes enlazadas
# con autor, licencia y enlace a la ficha. Nunca se ejecuta en pull requests: solo cron y lanzamiento manual.
on:
  schedule:
    - cron: "53 4 8 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run: no toca la BD y sube el JSON como artefacto"
        type: boolean
        default: false
      limit:
        description: "Máximo de bodegas emparejadas a procesar (vacío = todas)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: scrape-wikimedia
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Ejecutar scraper
        env:
          # Solo se pasan en ejecuciones reales; en dry-run no hacen falta.
          SUPABASE_URL: ${{ !inputs.dry_run && secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ !inputs.dry_run && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=(wikimedia)
          if [ -n "$DRY_RUN" ]; then args+=(--dry-run --out scrapers/out/wikimedia.json); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          node scrapers/cli.ts "${args[@]}"

      - name: Subir resultado del dry-run
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: wikimedia-dry-run
          path: scrapers/out/wikimedia.json
          if-no-files-found: ignore
          retention-days: 14
