<title>Tareas de wine-app</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna de lectura; cabecera con «ahora mismo», barra de progreso por estado y secciones de la lista. */
:root {
  --bg: #f6f5f7;
  --surface: #ffffff;
  --fg: #1f1a22;
  --muted: #5e5663;
  --line: #e4e0e7;
  --accent: #7b1f3a;          /* granate de tinto */
  --accent-soft: #f3e4ea;
  --ok: #2f7d4f;   --ok-soft: #e2f2e8;
  --run: #9a5b00;  --run-soft: #fbefd9;
  --block: #b3261e; --block-soft: #fbe3e1;
  --idle: #5e5663; --idle-soft: #eeebf0;
  --f-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16131a; --surface: #1f1b24; --fg: #eee9f1; --muted: #a59cab; --line: #332d39;
    --accent: #e7839f; --accent-soft: #3a2230;
    --ok: #6fcf97; --ok-soft: #1d3326; --run: #f0b65a; --run-soft: #3a2c14;
    --block: #f2867f; --block-soft: #3d1f1d; --idle: #a59cab; --idle-soft: #2a2530;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16131a; --surface: #1f1b24; --fg: #eee9f1; --muted: #a59cab; --line: #332d39;
  --accent: #e7839f; --accent-soft: #3a2230;
  --ok: #6fcf97; --ok-soft: #1d3326; --run: #f0b65a; --run-soft: #3a2c14;
  --block: #f2867f; --block-soft: #3d1f1d; --idle: #a59cab; --idle-soft: #2a2530;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }
header { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 6vw, 38px); line-height: 1.1; margin: 0; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 19px; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; }

.now { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start; }
.pulse { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--run); margin-top: 7px; box-shadow: 0 0 0 0 var(--run); animation: pulse 2s infinite; }
.now.quieto .pulse { background: var(--idle); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--run) 55%, transparent); } 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
.now-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.now-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.now-text { font-weight: 600; overflow-wrap: anywhere; }
.now-nota { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }

.progreso { display: flex; flex-direction: column; gap: 10px; }
.barra { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--idle-soft); }
.barra span { display: block; height: 100%; transition: width .4s ease; }
.leyenda { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.leyenda b { color: var(--fg); font-weight: 600; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

.filtros { display: flex; flex-wrap: wrap; gap: 6px; }
.filtros button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.filtros button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

section.grupo { display: flex; flex-direction: column; gap: 10px; }
.grupo-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.grupo-cab .cuenta { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
ul.lista { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
ul.lista li { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: start; }
ul.lista li:first-child { border-top: 0; }
.estado { font: inherit; font-family: var(--f-mono); font-size: 11px; letter-spacing: .03em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; border: 0; white-space: nowrap; min-width: 92px; text-align: center; margin-top: 1px; }
button.estado { cursor: pointer; }
.e-pendiente { background: var(--idle-soft); color: var(--idle); }
.e-en_curso { background: var(--run-soft); color: var(--run); }
.e-hecho { background: var(--ok-soft); color: var(--ok); }
.e-bloqueado { background: var(--block-soft); color: var(--block); }
.t-body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.t-titulo { font-weight: 500; overflow-wrap: anywhere; }
li.hecho .t-titulo { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 50%, transparent); }
.t-nota { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.t-meta { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.t-meta a { color: var(--accent); }

.aviso { font-size: 13px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 14px 16px; }
.vacio { padding: 18px 16px; color: var(--muted); font-size: 14px; }
footer { font-size: 12.5px; color: var(--muted); }
@media (max-width: 480px) {
  ul.lista li { grid-template-columns: 1fr; gap: 6px; }
  .estado { justify-self: start; min-width: 0; }
}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">wine-app · docs/TAREAS.md</span>
    <h1>Tareas de wine-app</h1>
    <p class="sub">Lo que queda por hacer, en orden. Se actualiza en directo cuando Claude cambia una tarea.</p>
  </header>

  <div class="now quieto" id="now" aria-live="polite">
    <span class="pulse" aria-hidden="true"></span>
    <div class="now-body">
      <span class="now-label">Ahora mismo</span>
      <span class="now-text" id="now-text">Cargando…</span>
      <span class="now-nota" id="now-nota"></span>
    </div>
  </div>

  <div class="progreso">
    <div class="barra" id="barra" role="img" aria-label="Progreso de las tareas"></div>
    <div class="leyenda" id="leyenda"></div>
  </div>

  <div class="filtros" role="group" aria-label="Filtrar tareas">
    <button type="button" id="f-abiertas" data-f="abiertas" aria-pressed="true">Por hacer</button>
    <button type="button" id="f-todas" data-f="todas" aria-pressed="false">Todas</button>
    <button type="button" id="f-hechas" data-f="hechas" aria-pressed="false">Hechas</button>
  </div>

  <div id="aviso" class="aviso" hidden></div>
  <div id="grupos"></div>

  <footer id="pie">Toca el estado de una tarea para cambiarlo (solo con permiso de edición).</footer>
</div>

<script>
(() => {
  const ESTADOS = {
    pendiente: { txt: "Pendiente", color: "var(--idle)" },
    en_curso: { txt: "En curso", color: "var(--run)" },
    bloqueado: { txt: "Te toca", color: "var(--block)" },
    hecho: { txt: "Hecho", color: "var(--ok)" },
  };
  const CICLO = ["pendiente", "en_curso", "hecho", "bloqueado"];
  const SECCIONES = ["Bloqueos", "Datos", "Producto · Fase 2", "Producto · Fase 3", "Rendimiento y menores"];
  let tareas = [];
  let ahora = null;
  let filtro = "abiertas";
  let puedeEscribir = false;
  let db = null;
  let cargado = false;

  try { const f = localStorage.getItem("filtro-tareas"); if (f) filtro = f; } catch (e) {}

  const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
  const fecha = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleString("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  };

  function pintarFiltros() {
    document.querySelectorAll(".filtros button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === filtro)));
  }

  function pintarAhora() {
    const box = document.getElementById("now");
    const t = document.getElementById("now-text");
    const n = document.getElementById("now-nota");
    if (!cargado) return;
    const activo = ahora && ahora.texto;
    box.classList.toggle("quieto", !activo || ahora.activo === false);
    t.textContent = activo ? ahora.texto : "Nada en marcha";
    const partes = [];
    if (ahora && ahora.nota) partes.push(ahora.nota);
    if (ahora && ahora.actualizado) partes.push("Actualizado " + fecha(ahora.actualizado));
    n.textContent = partes.join(" · ");
  }

  function pintarProgreso() {
    const cuenta = { hecho: 0, en_curso: 0, bloqueado: 0, pendiente: 0 };
    tareas.forEach((t) => { cuenta[t.estado in cuenta ? t.estado : "pendiente"]++; });
    const total = tareas.length || 1;
    const barra = document.getElementById("barra");
    barra.replaceChildren();
    ["hecho", "en_curso", "bloqueado", "pendiente"].forEach((k) => {
      const s = el("span");
      s.style.width = (cuenta[k] / total * 100) + "%";
      s.style.background = k === "pendiente" ? "transparent" : ESTADOS[k].color;
      barra.appendChild(s);
    });
    barra.setAttribute("aria-label", `${cuenta.hecho} de ${tareas.length} tareas hechas`);
    const ley = document.getElementById("leyenda");
    ley.replaceChildren();
    ["hecho", "en_curso", "bloqueado", "pendiente"].forEach((k) => {
      const i = el("span");
      const d = el("span", "dot"); d.style.background = ESTADOS[k].color;
      const b = el("b", null, String(cuenta[k]));
      i.append(d, b, " " + ESTADOS[k].txt.toLowerCase());
      ley.appendChild(i);
    });
  }

  function visible(t) {
    if (filtro === "todas") return true;
    if (filtro === "hechas") return t.estado === "hecho";
    return t.estado !== "hecho";
  }

  function pintarGrupos() {
    const cont = document.getElementById("grupos");
    cont.replaceChildren();
    if (!cargado) {
      cont.appendChild(el("div", "aviso", "Cargando la lista de tareas…"));
      return;
    }
    if (!tareas.length) {
      cont.appendChild(el("div", "aviso", "Todavía no hay tareas. Claude las carga desde docs/TAREAS.md y aparecerán aquí."));
      return;
    }
    const secciones = [...SECCIONES, ...new Set(tareas.map((t) => t.seccion).filter((s) => !SECCIONES.includes(s)))];
    const grid = el("div"); grid.style.display = "flex"; grid.style.flexDirection = "column"; grid.style.gap = "24px";
    secciones.forEach((sec) => {
      const todas = tareas.filter((t) => (t.seccion || "Otras") === sec);
      if (!todas.length) return;
      const vis = todas.filter(visible).sort((a, b) => (a.orden ?? 999) - (b.orden ?? 999));
      const g = el("section", "grupo");
      const cab = el("div", "grupo-cab");
      cab.append(el("h2", null, sec), el("span", "cuenta", `${todas.filter((t) => t.estado === "hecho").length}/${todas.length} hechas`));
      g.appendChild(cab);
      const ul = el("ul", "lista");
      if (!vis.length) ul.appendChild(el("li", "vacio", filtro === "hechas" ? "Ninguna hecha todavía." : "Todo hecho en esta sección."));
      vis.forEach((t) => {
        const li = el("li", t.estado === "hecho" ? "hecho" : "");
        const est = ESTADOS[t.estado] ? t.estado : "pendiente";
        const chip = el(puedeEscribir ? "button" : "span", "estado e-" + est, ESTADOS[est].txt);
        if (puedeEscribir) {
          chip.type = "button";
          chip.title = "Cambiar estado";
          chip.addEventListener("click", () => cambiar(t, chip));
        }
        const body = el("div", "t-body");
        body.appendChild(el("span", "t-titulo", t.titulo || "(sin título)"));
        if (t.nota) body.appendChild(el("span", "t-nota", t.nota));
        const meta = el("span", "t-meta");
        if (t.actualizado) meta.append("Actualizada " + fecha(t.actualizado));
        if (typeof t.pr === "string" && t.pr.startsWith("https://")) {
          if (meta.childNodes.length) meta.append(" · ");
          const a = el("a", null, "PR " + (t.pr.match(/\/pull\/(\d+)/)?.[1] ?? ""));
          a.href = t.pr; a.target = "_blank"; a.rel = "noopener";
          meta.appendChild(a);
        }
        if (meta.childNodes.length) body.appendChild(meta);
        li.append(chip, body);
        ul.appendChild(li);
      });
      g.appendChild(ul);
      grid.appendChild(g);
    });
    cont.appendChild(grid);
  }

  function pintar() { pintarFiltros(); pintarAhora(); pintarProgreso(); pintarGrupos(); }

  let escribiendo = new Set();
  async function cambiar(t, chip) {
    if (!db || escribiendo.has(t.id)) return;
    const sig = CICLO[(CICLO.indexOf(t.estado) + 1) % CICLO.length];
    escribiendo.add(t.id);
    chip.disabled = true;
    try {
      await db.collection("tareas").doc(t.id).update({ estado: sig, actualizado: new Date().toISOString() });
    } catch (e) {
      if (e && e.code === "invalid_argument") { puedeEscribir = false; pintar(); }
      mostrarAviso("No se pudo cambiar el estado. Prueba de nuevo en un momento.");
    } finally {
      escribiendo.delete(t.id);
      chip.disabled = false;
    }
  }

  function mostrarAviso(txt) {
    const a = document.getElementById("aviso");
    a.textContent = txt; a.hidden = !txt;
  }

  document.querySelectorAll(".filtros button").forEach((b) => b.addEventListener("click", () => {
    filtro = b.dataset.f;
    try { localStorage.setItem("filtro-tareas", filtro); } catch (e) {}
    pintar();
  }));

  pintar();

  (async () => {
    db = window.claude?.use ? await window.claude.use("db") : null;
    if (!db) {
      cargado = true;
      mostrarAviso("No se puede leer la lista desde esta vista. Ábrela con tu cuenta de Claude.");
      document.getElementById("now-text").textContent = "Sin conexión con la lista";
      pintar();
      return;
    }
    const user = await window.claude.use("user");
    try { const c = await user?.can("data.write"); puedeEscribir = c !== false; } catch (e) { puedeEscribir = false; }
    if (!puedeEscribir) document.getElementById("pie").textContent = "Solo lectura: la lista la actualiza Claude.";

    const timer = setTimeout(() => { if (!cargado) mostrarAviso("La lista tarda en llegar. Puede que lo que ves no esté al día."); }, 10000);
    db.collection("tareas").onSnapshot((snap) => {
      tareas = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache) { cargado = true; clearTimeout(timer); mostrarAviso(""); }
      else if (snap.size) cargado = true;
      pintar();
    }, () => { cargado = true; clearTimeout(timer); mostrarAviso("Se ha perdido la conexión con la lista. Vuelve a abrir la página."); pintar(); });
    db.doc("estado/ahora").onSnapshot((d) => { ahora = d.exists ? d.data() : null; pintarAhora(); }, () => {});
  })();
})();
</script>
